name: Publish JRSSB V5 PDFs

on:
  push:
    branches: [jrssb/v5-submission]
    paths:
      - 'JRSSB/submission_v5/04_LaTeX_Source/**'
      - 'JRSSB/submission_v5/SOURCE_GIT_HASHES.txt'
      - 'JRSSB/submission_v5/tools/**'
      - '.github/workflows/publish-jrssb-v5.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jrssb-v5-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/jrssb/v5-submission'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - name: Install document build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils
      - name: Check frozen sources and build publication files
        run: python3 JRSSB/submission_v5/tools/publish_pdfs.py
      - name: Publish compiled files on the same branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f JRSSB/submission_v5/01_Manuscript JRSSB/submission_v5/02_Supplementary_Material JRSSB/submission_v5/03_Cover_Letter JRSSB/submission_v5/05_Separate_Figures JRSSB/submission_v5/downloads JRSSB/submission_v5/build_report.json JRSSB/submission_v5/SHA256SUMS.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Publish compiled JRSSB V5 manuscript, supplement and submission sources'
            git push origin HEAD:jrssb/v5-submission
          fi
      - name: Retain editorial package artifact
        uses: actions/upload-artifact@v4
        with:
          name: JRSSB-V5-editorial-submission
          path: JRSSB/submission_v5/downloads/JRSSB_V5_editorial_submission.zip
          retention-days: 30
